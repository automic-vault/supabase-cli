name:
  isotope:supabase

replaces:
  brew:supabase

build: |
  version="$(git tag --points-at HEAD | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p' | sort -V | tail -1)"
  if [ -z "$version" ]; then
    version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
  fi
  pnpm dlx pnpm@12.15.0 install --frozen-lockfile --os=darwin --cpu=arm64
  mkdir -p bin
  cd apps/cli
  SUPABASE_CLI_VERSION="$version" pnpm dlx bun@1.4.1 scripts/build-binary.ts
  cp dist/supabase ../../bin/supabase
  cd ../../isotope/supabase-go
  CGO_ENABLED=1 go build \
    -tags automicvault \
    -trimpath \
    -ldflags="-s -w" \
    -o ../../bin/supabase-go \
    .
  cd ../..
  codesign --force --options runtime --timestamp \
    --sign "$CODESIGN_IDENTITY" \
    bin/supabase \
    bin/supabase-go
  tar czf out.tgz bin

justification:
  title:
    Unprotected Credential Access
  detail: |
    Supabase CLI can store access tokens in plaintext or in macOS Keychain
    items that `/usr/bin/security` can read non-interactively.

    This Isotope builds a signed Supabase CLI and routes stored credential
    reads, writes, and deletions through an Automic Vault Authorization Gate.

caveats:
  - Existing unprotected Supabase CLI Keychain items and plaintext fallback
    access tokens are migrated by running `av harden supabase`.
  - This currently replaces the Homebrew core supabase formula.
